name: DEN-957 one-shot shared-bootstrap finalizer

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/den-957-shared-bootstrap-finalize.yml

permissions:
  contents: write

concurrency:
  group: den-957-fiducia-shared-bootstrap-finalize
  cancel-in-progress: false

jobs:
  finalize:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/den-957-shared-bootstrap'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out exact adoption branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/den-957-shared-bootstrap
          path: fiducia-mcp-server.rs
          fetch-depth: 0
          persist-credentials: true

      - name: Check out pinned sibling client
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: fiducia-cloud/fiducia-clients
          ref: 5cd1a537f7ab98808ece4cdd09723be0bf49ce8b
          path: fiducia-clients
          persist-credentials: false

      - name: Install validation toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: '1.97.0'
          components: rustfmt,clippy

      - name: Delegate identity and telemetry filtering to shared policy
        working-directory: fiducia-mcp-server.rs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          telemetry = Path('src/telemetry.rs')
          text = telemetry.read_text(encoding='utf-8')

          old_limit = 'const MAX_RESOURCE_ATTRIBUTES_RAW_BYTES: usize = 16 * 1024;'
          new_limit = '''const MAX_RESOURCE_ATTRIBUTES_RAW_BYTES: usize =
              ore_mcp_bootstrap::telemetry::MAX_RESOURCE_ATTRIBUTE_BYTES;'''
          if text.count(old_limit) != 1:
              raise SystemExit('expected exactly one local resource-attribute byte ceiling')
          text = text.replace(old_limit, new_limit)

          old_resource = '    let resource = resource(service_name, service_namespace);'
          new_resource = '''    let identity = ore_mcp_bootstrap::runtime::ServerIdentity::stdio(
              service_name,
              service_namespace,
          )
          .expect("static MCP service identity must be valid");
          let service_name = identity.service_name();
          let service_namespace = identity.service_namespace();
          let resource = resource(service_name, service_namespace);'''
          if text.count(old_resource) != 1:
              raise SystemExit('expected exactly one telemetry resource construction')
          text = text.replace(old_resource, new_resource)

          parser_start = text.index('fn resource_attribute_pairs(')
          value_validator_start = text.index('fn valid_attribute_value(', parser_start)
          shared_parser = '''fn resource_attribute_pairs(raw: &str) -> impl Iterator<Item = (String, String)> {
              let mut attributes = Vec::new();
              if raw.len() > MAX_RESOURCE_ATTRIBUTES_RAW_BYTES {
                  return attributes.into_iter();
              }

              let mut seen = HashSet::new();
              for (key, value) in ore_mcp_bootstrap::telemetry::resource_attribute_pairs(raw) {
                  if attributes.len() >= MAX_RESOURCE_ATTRIBUTES {
                      break;
                  }
                  if !reserved_resource_attribute_key(&key) && seen.insert(key.clone()) {
                      attributes.push((key, value));
                  }
              }

              attributes.into_iter()
          }

          '''
          text = text[:parser_start] + shared_parser + text[value_validator_start:]

          sensitive_start = text.index('fn sensitive_attribute_key(')
          tool_comment = text.index('/// Add one explicit span', sensitive_start)
          text = text[:sensitive_start] + text[tool_comment:]
          telemetry.write_text(text, encoding='utf-8')

          observability = Path('OBSERVABILITY.md')
          docs = observability.read_text(encoding='utf-8')
          old_docs = '- at most 16 KiB raw input;'
          new_docs = '- at most 8 KiB raw input, enforced by the immutable shared bootstrap policy;'
          if docs.count(old_docs) != 1:
              raise SystemExit('expected the documented 16 KiB resource ceiling exactly once')
          observability.write_text(docs.replace(old_docs, new_docs), encoding='utf-8')

          architecture = Path('tests/runtime_architecture.rs')
          contract = architecture.read_text(encoding='utf-8')
          old_policy_marker = '        "sensitive_attribute_key",'
          new_policy_marker = '        "ore_mcp_bootstrap::telemetry::resource_attribute_pairs",'
          if contract.count(old_policy_marker) != 1:
              raise SystemExit('expected the local sensitive-key architecture marker exactly once')
          contract = contract.replace(old_policy_marker, new_policy_marker)

          old_docs_marker = '        "at most 16 KiB raw input",'
          new_docs_marker = '        "at most 8 KiB raw input",'
          if contract.count(old_docs_marker) != 1:
              raise SystemExit('expected the 16 KiB documentation architecture marker exactly once')
          architecture.write_text(
              contract.replace(old_docs_marker, new_docs_marker),
              encoding='utf-8',
          )
          PY

      - name: Resolve and validate the exact branch
        working-directory: fiducia-mcp-server.rs
        shell: bash
        run: |
          set -euo pipefail
          cargo generate-lockfile
          cargo fmt --all
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo build --release --locked
          cargo test --locked --all-targets
          RUSTDOCFLAGS='-D warnings' cargo doc --locked --no-deps
          grep -F 'rev = "a5c1ba9c50493ac625dd2fb175af21263d0d2801"' Cargo.toml
          grep -F 'a5c1ba9c50493ac625dd2fb175af21263d0d2801' Cargo.lock
          grep -F 'ore_mcp_bootstrap::runtime::ServerIdentity::stdio' src/telemetry.rs
          grep -F 'ore_mcp_bootstrap::telemetry::resource_attribute_pairs' src/telemetry.rs
          grep -F 'at most 8 KiB raw input' OBSERVABILITY.md
          if grep -F 'fn valid_attribute_key' src/telemetry.rs; then
            echo 'duplicated local attribute-key validation remains' >&2
            exit 1
          fi
          if grep -F 'fn sensitive_attribute_key' src/telemetry.rs; then
            echo 'duplicated local sensitive-key validation remains' >&2
            exit 1
          fi
          git diff --check
          if grep -R --line-number -E '^(<{7}|={7}|>{7})' src tests OBSERVABILITY.md Cargo.toml; then
            echo 'Git conflict markers are forbidden.' >&2
            exit 1
          fi

      - name: Remove helper, commit, and push permanent review head
        working-directory: fiducia-mcp-server.rs
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/den-957-shared-bootstrap-finalize.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'feat(DEN-957): adopt shared MCP bootstrap policy'
          git push origin HEAD:agent/den-957-shared-bootstrap
