name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          path: fiducia-mcp-server.rs
      - name: Validate GitHub Actions
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: fiducia-mcp-server.rs/.github/workflows/ci.yml fiducia-mcp-server.rs/.github/workflows/web-smoke.yml
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          repository: fiducia-cloud/fiducia-clients
          ref: 5cd1a537f7ab98808ece4cdd09723be0bf49ce8b
          path: fiducia-clients
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          repository: ORESoftware/flags-2-env
          ref: 377bff1a4e7424eb98377997a232ddc0fc700f59
          path: flags2env
      - name: Audit exact CLI contract
        shell: bash
        run: |
          set -euo pipefail
          make -C flags2env cli
          flags2env/build/flags2env audit fiducia-mcp-server.rs/.cli-flags.toml
          grep -F 'rev = "377bff1a4e7424eb98377997a232ddc0fc700f59"' fiducia-mcp-server.rs/Cargo.toml
          grep -F '377bff1a4e7424eb98377997a232ddc0fc700f59' fiducia-mcp-server.rs/Cargo.lock
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: "1.97.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: fiducia-mcp-server.rs
      - name: Format
        working-directory: fiducia-mcp-server.rs
        run: cargo fmt --all -- --check
      - name: Clippy
        working-directory: fiducia-mcp-server.rs
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Build (release)
        working-directory: fiducia-mcp-server.rs
        run: cargo build --release --locked
      - name: Test
        working-directory: fiducia-mcp-server.rs
        run: cargo test --locked --all-targets
      - name: Documentation
        working-directory: fiducia-mcp-server.rs
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --no-deps
      - name: Enforce runtime and telemetry boundaries
        shell: bash
        run: |
          set -euo pipefail
          root=fiducia-mcp-server.rs
          test -f "$root/OBSERVABILITY.md"
          test -f "$root/src/runtime.rs"
          test -f "$root/tests/runtime_architecture.rs"
          if [ "$(wc -l < "$root/src/main.rs")" -gt 8 ]; then
            echo 'src/main.rs must remain a thin binary bootstrap' >&2
            exit 1
          fi
          git -C "$root" grep -qF 'pub async fn run_stdio' -- src/runtime.rs
          git -C "$root" grep -qF 'process_log_filter' -- src/runtime.rs
          git -C "$root" grep -qF 'MAX_OTLP_ENDPOINT_BYTES' -- src/telemetry.rs
          git -C "$root" grep -qF 'MAX_RESOURCE_ATTRIBUTES_RAW_BYTES' -- src/telemetry.rs
          git -C "$root" grep -qF 'MAX_RESOURCE_ATTRIBUTES' -- src/telemetry.rs
          git -C "$root" grep -qF 'sanitize_otlp_endpoint' -- src/telemetry.rs
          git -C "$root" grep -qF '.with_writer(std::io::stderr)' -- src/telemetry.rs
          git -C "$root" grep -qF 'mcp.server.tool.calls' -- src/telemetry.rs
          git -C "$root" grep -qF 'mcp.server.tool.duration' -- src/telemetry.rs
          if git -C "$root" grep -nE 'serve\(|telemetry::init|process_log_filter|Config::from_env' -- src/main.rs; then
            echo 'runtime lifecycle must not regress into src/main.rs' >&2
            exit 1
          fi
          if git -C "$root" grep -nE '(^|[^[:alnum:]_])print(ln)?!' -- src/main.rs src/runtime.rs src/telemetry.rs; then
            echo 'stdout writes are forbidden in the MCP runtime and telemetry modules' >&2
            exit 1
          fi
          git -C "$root" diff --check
      - name: Build non-root tool-runner image
        working-directory: fiducia-mcp-server.rs
        run: docker build --tag "fiducia-mcp:${GITHUB_SHA}" .
      - name: Verify final image flags runtime and MCP stdout framing
        shell: bash
        run: |
          set -euo pipefail
          image="fiducia-mcp:${GITHUB_SHA}"
          docker run --rm --entrypoint sh "$image" -lc '
            test -r /usr/local/share/fiducia-mcp-server/.cli-flags.toml
            if ldd /usr/local/bin/fiducia-mcp 2>/dev/null | grep -qi flags2env; then
              echo "runtime unexpectedly depends on a flags2env shared library" >&2
              exit 1
            fi
          '

          set +e
          secret_output=$(docker run --rm "$image" \
            --fiducia-api-key=must-remain-environment-only 2>&1)
          secret_status=$?
          set -e
          printf '%s\n' "$secret_output"
          test "$secret_status" -ne 0
          case "$secret_output" in
            *'--fiducia-api-key=must-remain-environment-only'*) ;;
            *) echo 'final image did not identify the rejected secret-bearing flag' >&2; exit 1 ;;
          esac

          stdout_file=$(mktemp)
          stderr_file=$(mktemp)
          trap 'rm -f "$stdout_file" "$stderr_file"' EXIT
          initialize='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"flags2env-ci","version":"1.0"}}}'
          set +e
          printf '%s\n' "$initialize" | timeout 15s docker run --rm -i "$image" --log-filter=debug \
            >"$stdout_file" 2>"$stderr_file"
          smoke_status=$?
          set -e
          case "$smoke_status" in
            0|1|124) ;;
            *) cat "$stderr_file" >&2; exit "$smoke_status" ;;
          esac
          python3 - "$stdout_file" <<'PY'
          import json
          import pathlib
          import sys

          lines = [line for line in pathlib.Path(sys.argv[1]).read_text().splitlines() if line.strip()]
          if not lines:
              raise SystemExit("MCP server emitted no initialize response")
          messages = [json.loads(line) for line in lines]
          if any(message.get("jsonrpc") != "2.0" for message in messages):
              raise SystemExit("stdout contained non-JSON-RPC output")
          if not any(message.get("id") == 1 and ("result" in message or "error" in message) for message in messages):
              raise SystemExit("MCP server emitted no response for initialize id=1")
          PY
          case "$(cat "$stderr_file")" in
            *'unknown command-line option'*|*'flags-2-env configuration audit failed'*|*'invalid --log-filter'*)
              cat "$stderr_file" >&2
              exit 1
              ;;
          esac
      - name: Verify full MCP stdio lifecycle and safe read-only dispatch
        working-directory: fiducia-mcp-server.rs
        run: |
          python3 -m py_compile scripts/smoke-mcp-stdio.py
          python3 scripts/smoke-mcp-stdio.py "fiducia-mcp:${GITHUB_SHA}"
      - uses: taiki-e/install-action@67729d5c413db75907f0ad1e39bb04b9c868ff60 # v2
        with:
          tool: cargo-audit@0.22.2
      - name: Dependency audit
        working-directory: fiducia-mcp-server.rs
        run: cargo audit
