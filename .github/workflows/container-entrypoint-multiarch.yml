name: Container entrypoint and multi-arch

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-entrypoint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  entrypoint-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify SOPS wrapper syntax and exit propagation
        shell: bash
        run: |
          set -euo pipefail
          sh -n scripts/sops-entrypoint.sh
          test "$(SOPS_SECRETS_FILE=/tmp/not-present sh scripts/sops-entrypoint.sh sh -c 'printf ok')" = "ok"
          set +e
          SOPS_SECRETS_FILE=/tmp/not-present sh scripts/sops-entrypoint.sh sh -c 'exit 23'
          status=$?
          set -e
          test "$status" -eq 23

  docker-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build --progress=plain --tag fiducia-mcp:ci .
      - name: Verify image execution metadata
        shell: bash
        run: |
          set -euo pipefail
          test "$(docker image inspect fiducia-mcp:ci --format '{{json .Config.Entrypoint}}')" = '["/usr/local/bin/sops-entrypoint.sh"]'
          test "$(docker image inspect fiducia-mcp:ci --format '{{json .Config.Cmd}}')" = '["/usr/local/bin/fiducia-mcp"]'

  buildx-multiarch:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build amd64 and arm64 OCI image
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --progress=plain \
            --output type=oci,dest=/tmp/fiducia-mcp.oci.tar \
            .
          test -s /tmp/fiducia-mcp.oci.tar
