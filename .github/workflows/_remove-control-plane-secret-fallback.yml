name: Remove control-plane credential fallback

on:
  push:
    branches:
      - 'harden/dockerfile-sops-otel-sidecar'
    paths:
      - '.github/workflows/_remove-control-plane-secret-fallback.yml'

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out remediation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: fiducia-mcp-server.rs
          fetch-depth: 0
          persist-credentials: true

      - name: Check out CI-pinned sibling client
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: fiducia-cloud/fiducia-clients
          ref: 5cd1a537f7ab98808ece4cdd09723be0bf49ce8b
          path: fiducia-clients
          persist-credentials: false

      - name: Install repository Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.97.0
          components: rustfmt, clippy

      - name: Remove fallback and add regression coverage
        working-directory: fiducia-mcp-server.rs
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path('src/upstream.rs')
          text = path.read_text(encoding='utf-8')

          old_config = '''            // The agent control plane checks FIDUCIA_CONTROL_PLANE_SECRET and
            // falls back to FIDUCIA_INTERNAL_SECRET; mirror that here.
            control_plane_secret: env_nonempty(CONTROL_PLANE_SECRET_ENV)
                .or_else(|| env_nonempty(INTERNAL_SECRET_ENV)),'''
          new_config = '''            // Distinct trust plane, distinct credential. Never widen an internal
            // node/brain secret into the agent control plane by fallback.
            control_plane_secret: env_nonempty(CONTROL_PLANE_SECRET_ENV),'''
          if text.count(old_config) != 1:
              raise SystemExit('expected exactly one control-plane fallback block')
          text = text.replace(old_config, new_config)

          old_error = '''                        "{CONTROL_PLANE_SECRET_ENV} (or {INTERNAL_SECRET_ENV}) is required \\
                         for ai-agent control plane calls"'''
          new_error = '''                        "{CONTROL_PLANE_SECRET_ENV} is required for ai-agent control plane calls; \\
                         credentials are not shared across trust planes"'''
          if text.count(old_error) != 1:
              raise SystemExit('expected exactly one fallback error message')
          text = text.replace(old_error, new_error)

          anchor = '''    #[test]
    fn agent_cp_uses_x_internal_auth() {
        let headers = cfg().headers(Plane::AgentControlPlane).unwrap();
        assert_eq!(headers, vec![("x-internal-auth", "cp-s3cret".to_string())]);
    }
'''
          addition = anchor + '''
    #[test]
    fn agent_cp_does_not_fall_back_to_internal_secret() {
        let mut c = cfg();
        c.control_plane_secret = None;
        let error = c.headers(Plane::AgentControlPlane).unwrap_err();
        assert!(error.contains(CONTROL_PLANE_SECRET_ENV));
        assert!(!error.contains("or FIDUCIA_INTERNAL_SECRET"));
    }
'''
          if text.count(anchor) != 1:
              raise SystemExit('expected exactly one agent control-plane test anchor')
          path.write_text(text.replace(anchor, addition), encoding='utf-8')
          PY

          cargo fmt --all -- --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --all-targets
          git diff --check

      - name: Commit tested repair and remove workflow
        working-directory: fiducia-mcp-server.rs
        shell: bash
        run: |
          set -euo pipefail
          git rm -- .github/workflows/_remove-control-plane-secret-fallback.yml
          git add src/upstream.rs
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(auth): remove cross-plane credential fallback'
          git push origin "HEAD:${GITHUB_REF_NAME}"
