name: Apply DNS tool annotations v2

on:
  push:
    branches:
      - agent/annotate-gated-dns-tools
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/apply-dns-tool-annotations-v2.yml'

permissions:
  contents: write

concurrency:
  group: apply-dns-tool-annotations-v2-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  patch-and-verify:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/annotate-gated-dns-tools
          persist-credentials: true
          path: fiducia-mcp-server.rs
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          repository: fiducia-cloud/fiducia-clients
          ref: 5cd1a537f7ab98808ece4cdd09723be0bf49ce8b
          path: fiducia-clients
      - name: Apply the reviewed annotation patch
        working-directory: fiducia-mcp-server.rs
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/apply-dns-tool-annotations.yml').read_text(encoding='utf-8')
          start = '      - name: Annotate DNS tools and strengthen gate tests\n'
          end = '      - uses: dtolnay/rust-toolchain@'
          if workflow.count(start) != 1 or workflow.count(end) != 1:
              raise SystemExit('Fiducia annotation patch markers are not unique')
          block = workflow.split(start, 1)[1].split(end, 1)[0]
          prefix = '        shell: bash\n        run: |\n'
          if not block.startswith(prefix):
              raise SystemExit('Fiducia annotation patch shape changed')
          lines = block[len(prefix):].splitlines()
          if any(line and not line.startswith('          ') for line in lines):
              raise SystemExit('Fiducia annotation patch indentation changed')
          script = '\n'.join(line[10:] if line else '' for line in lines) + '\n'
          output = Path('/tmp/apply-fiducia-dns-annotations.sh')
          output.write_text(script, encoding='utf-8')
          output.chmod(0o700)
          PY
          /tmp/apply-fiducia-dns-annotations.sh
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: '1.97.0'
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: fiducia-mcp-server.rs
      - name: Format
        working-directory: fiducia-mcp-server.rs
        run: cargo fmt --all
      - name: Clippy
        working-directory: fiducia-mcp-server.rs
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        working-directory: fiducia-mcp-server.rs
        run: cargo test --locked --all-targets
      - name: Release build
        working-directory: fiducia-mcp-server.rs
        run: cargo build --locked --release
      - name: Scan for unresolved conflict markers
        working-directory: fiducia-mcp-server.rs
        run: |
          if git grep -n -E '^(<<<<<<< |=======$|>>>>>>> )' -- . ':(exclude)*.lock'; then
            exit 1
          fi
      - name: Commit verified annotation changes
        working-directory: fiducia-mcp-server.rs
        shell: bash
        run: |
          set -euo pipefail
          git add -- src/server.rs src/cloudflare.rs
          if git diff --cached --quiet; then
            echo 'DNS tool annotations already applied.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Annotate and test gated DNS tools'
          git push origin HEAD:agent/annotate-gated-dns-tools
