name: Refresh stale Cargo lockfile

on:
  push:
    branches:
      - 'harden/dockerfile-sops-otel-sidecar'
    paths:
      - '.github/workflows/_refresh-stale-lockfile.yml'

permissions:
  contents: write

jobs:
  refresh-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the remediation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: fiducia-mcp-server.rs
          fetch-depth: 0
          # This one-shot job removes itself and pushes only after all checks pass.
          persist-credentials: true

      - name: Check out the CI-pinned sibling client
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: fiducia-cloud/fiducia-clients
          ref: 5cd1a537f7ab98808ece4cdd09723be0bf49ce8b
          path: fiducia-clients
          persist-credentials: false

      - name: Install the repository Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.97.0
          components: rustfmt, clippy

      - name: Restore fail-early Kubernetes input validation
        working-directory: fiducia-mcp-server.rs
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path("src/k8s.rs")
          before = path.read_text(encoding="utf-8")
          old = '''    let context = validate_context(context).await?;
              let service = validate_k8s_dns_label(service, "service")?;
              let namespace = validate_k8s_dns_label(&namespace_or_default(namespace), "namespace")?;'''.replace("              ", "    ")
          new = '''    let service = validate_k8s_dns_label(service, "service")?;
              let namespace = validate_k8s_dns_label(&namespace_or_default(namespace), "namespace")?;
              let context = validate_context(context).await?;'''.replace("              ", "    ")
          if before.count(old) != 1:
              raise SystemExit("expected exactly one service_endpoints validation block")
          path.write_text(before.replace(old, new), encoding="utf-8")
          PY

      - name: Refresh only what Cargo requires and verify the locked build
        working-directory: fiducia-mcp-server.rs
        shell: bash
        run: |
          set -euo pipefail
          cp Cargo.lock /tmp/Cargo.lock.before
          cargo check --all-targets
          test -s Cargo.lock
          if cmp -s /tmp/Cargo.lock.before Cargo.lock; then
            echo 'Cargo.lock was already current; refusing an empty repair' >&2
            exit 1
          fi
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --all-targets
          git diff --check

      - name: Commit the tested repair and remove this workflow
        working-directory: fiducia-mcp-server.rs
        shell: bash
        run: |
          set -euo pipefail
          git rm -- .github/workflows/_refresh-stale-lockfile.yml
          git add Cargo.lock src/k8s.rs
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(build): refresh lockfile and fail early on k8s input'
          git push origin "HEAD:${GITHUB_REF_NAME}"
