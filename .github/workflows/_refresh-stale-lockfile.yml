name: Refresh stale Cargo lockfile

on:
  push:
    branches:
      - 'harden/dockerfile-sops-otel-sidecar'
    paths:
      - '.github/workflows/_refresh-stale-lockfile.yml'

permissions:
  contents: write

jobs:
  refresh-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the remediation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: fiducia-mcp-server.rs
          fetch-depth: 0

      - name: Check out the CI-pinned sibling client
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: fiducia-cloud/fiducia-clients
          ref: 5cd1a537f7ab98808ece4cdd09723be0bf49ce8b
          path: fiducia-clients
          persist-credentials: false

      - name: Install the repository Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.97.0
          components: rustfmt, clippy

      - name: Refresh only what Cargo requires and verify the locked build
        working-directory: fiducia-mcp-server.rs
        shell: bash
        run: |
          set -euo pipefail
          cp Cargo.lock /tmp/Cargo.lock.before
          cargo check --all-targets
          test -s Cargo.lock
          if cmp -s /tmp/Cargo.lock.before Cargo.lock; then
            echo 'Cargo.lock was already current; refusing an empty repair' >&2
            exit 1
          fi
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --all-targets
          git diff --check

      - name: Commit the tested lock repair and remove this workflow
        working-directory: fiducia-mcp-server.rs
        shell: bash
        run: |
          set -euo pipefail
          git rm -- .github/workflows/_refresh-stale-lockfile.yml
          git add Cargo.lock
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(build): refresh stale Cargo lockfile'
          git push origin "HEAD:${GITHUB_REF_NAME}"
