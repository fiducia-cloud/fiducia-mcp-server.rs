name: DEN-957 lock refresh

on:
  push:
    branches:
      - agent/DEN-957-dedupe-bootstrap-dependency
  workflow_dispatch:

# Temporary branch-scoped permission. This workflow is deleted after the exact
# generated Cargo.lock is committed to the PR branch.
permissions:
  contents: write

concurrency:
  group: den-957-lock-refresh-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    if: github.repository == 'fiducia-cloud/fiducia-mcp-server.rs' && github.ref == 'refs/heads/agent/DEN-957-dedupe-bootstrap-dependency'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/DEN-957-dedupe-bootstrap-dependency
          persist-credentials: true
          path: fiducia-mcp-server.rs
          submodules: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: fiducia-cloud/fiducia-clients
          ref: 5cd1a537f7ab98808ece4cdd09723be0bf49ce8b
          path: fiducia-clients
          submodules: false

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: "1.97.0"

      - name: Refresh only the affected locked Git source
        working-directory: fiducia-mcp-server.rs
        shell: bash
        run: |
          set -euo pipefail
          cargo update -p ore-mcp-bootstrap --precise a5c1ba9c50493ac625dd2fb175af21263d0d2801
          cargo metadata --locked --format-version 1 --no-deps >/dev/null
          git diff --check -- Cargo.lock
          test -s Cargo.lock

      - name: Commit only Cargo.lock to the reviewed branch
        working-directory: fiducia-mcp-server.rs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          if git diff --cached --quiet; then
            echo "Cargo.lock is already current"
            exit 0
          fi
          test "$(git diff --cached --name-only)" = "Cargo.lock"
          git commit -m "build(DEN-957): refresh shared bootstrap lock source"
          git push origin HEAD:agent/DEN-957-dedupe-bootstrap-dependency
