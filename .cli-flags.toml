# MCP stdout is reserved for JSON-RPC. Only non-secret logging configuration is
# accepted as a process flag; all upstream topology and authentication remain
# environment-only.

[help]
url = "https://github.com/fiducia-cloud/fiducia-mcp-server.rs#configuration"
columns = ["options", "env", "type", "default", "description"]

[parse]
allow_unknown = false

[env]
ignore = ["FIDUCIA_NODE_URL", "FIDUCIA_BRAIN_URL", "FIDUCIA_AGENT_CONTROL_PLANE_URL", "FIDUCIA_INTERNAL_SECRET", "FIDUCIA_CONTROL_PLANE_SECRET", "FIDUCIA_ORG_ID", "FIDUCIA_API_KEY", "CLOUDFLARE_API_TOKEN", "KUBECONFIG", "OTEL_EXPORTER_OTLP_ENDPOINT", "OTEL_EXPORTER_OTLP_HEADERS", "OTEL_RESOURCE_ATTRIBUTES", "HOME", "PATH"]

[flags.log-filter]
env = "RUST_LOG"
aliases = ["log-filter"]
type = "string"
default = "info,hyper=warn"
help = "Tracing filter for structured stderr logs."
